<!DOCTYPE html>
<html>

<head>
  <title>Map of Bitcoin Monitoring</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.css" />
  <script>
    window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
  </script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.2.0"
    }
  }
  </script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    .container {
      font-family: sans-serif;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #app {
      flex: 1;
    }

    .excalidraw-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    :root[dir="ltr"] .excalidraw .layer-ui__wrapper .zen-mode-transition.App-menu_bottom--transition-left {
      transform: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Map of Bitcoin Monitoring</h1>
    <div id="app"></div>
  </div>
</body>



<script type="module">
  import * as ExcalidrawLib from 'https://esm.sh/@excalidraw/excalidraw@0.18.0?external=react,react-dom';
  import React from "https://esm.sh/react@18.2.0";
  import { createRoot } from "https://esm.sh/react-dom@18.2.0/client";

  window.ExcalidrawLib = ExcalidrawLib;

  const App = () => {
    const [excalidrawAPI, setExcalidrawAPI] = React.useState(null);
    const excalidrawWrapperRef = React.useRef(null);
    const [dimensions, setDimensions] = React.useState({
      width: undefined,
      height: undefined,
    });

    React.useEffect(() => {
      setDimensions({
        width: excalidrawWrapperRef.current.getBoundingClientRect().width,
        height: excalidrawWrapperRef.current.getBoundingClientRect().height,
      });
      const onResize = () => {
        setDimensions({
          width: excalidrawWrapperRef.current.getBoundingClientRect().width,
          height:
            excalidrawWrapperRef.current.getBoundingClientRect().height,
        });
      };

      window.addEventListener("resize", onResize);

      return () => window.removeEventListener("resize", onResize);
    }, [excalidrawWrapperRef]);

    React.useEffect(() => {
      if (!excalidrawAPI) return;

      const load = async () => {
        const response = await fetch("https://bitcoin-noc.github.io/map-of-bitcoin-monitoring/map.excalidraw");
        const data = await response.json();

        console.log(data)

        if (data.files) {
          excalidrawAPI.addFiles(data.files);
          console.log(data.files)
        }

        excalidrawAPI.updateScene({
          elements: data.elements,
          appState: data.appState,
          files: data.files,
        });
      };

      load();
    }, [excalidrawAPI]);

    return React.createElement(
      React.Fragment,
      null,
      React.createElement(
        "div",
        {
          className: "excalidraw-wrapper",
          ref: excalidrawWrapperRef,
        },
        React.createElement(ExcalidrawLib.Excalidraw, {
          excalidrawAPI: (api) => setExcalidrawAPI(api),
          zenModeEnabled: true,
          viewModeEnabled: true,
          langCode: "en-US",
        })
      )
    );
  };

  const excalidrawWrapper = document.getElementById("app");
  const root = createRoot(excalidrawWrapper);
  root.render(React.createElement(App));
</script>


</html>
